[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financepy"
version = "1.1.2"
readme = "README.md"

authors = [
    {name = "Dominic O'Kane"}
]

license = "GPL-3.0-or-later"

# Move keywords here
keywords = ["FINANCE", "OPTIONS", "BONDS", "VALUATION", "DERIVATIVES"]

description = "A Finance Securities Valuation Library"

# Python compatibility must match NumPy / SciPy reality
requires-python = ">=3.11,<3.15"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

# 1. This is where your package list belongs
dependencies = [
    "numpy>=2.3.5",
    "scipy>=1.16.3",
    "pandas>=2.3.3",
    "matplotlib>=3.10.6",
    "numba>=0.67.0",
    "nord-mpl",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.25,<9",
    "mypy>=1.13,<2",
    "typing-extensions>=4.12,<5",
]

test = [
    "pytest>=8,<10",
    "pytest-benchmark>=5.2",
    "more-itertools>=10,<11",
]

[tool.setuptools]

[tool.setuptools.package-data]
"financepy.models" = ["sobolcoeff.npz"]

[tool.setuptools.packages.find]
include = ["financepy*"]
exclude = ["venv*", "notebooks*", "golden_tests*", "tests*"]

[project.urls]
Source = "https://github.com/domokane/FinancePy"
Tracker = "https://github.com/domokane/FinancePy/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--ignore=tests/unit/legacy"
]

filterwarnings = [
    "ignore::pyparsing.PyparsingDeprecationWarning",
]

markers = [
    "unit: implementation unit tests",
    "regression: regression and golden-result tests",
    "validation: independent financial validation tests",
]

[tool.uv.sources]
nord-mpl = { git = "https://github.com/bakj1979/perso_nord_mpl", rev = "v0.3.0" }

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "hypothesis>=6.170.13",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
